# Llama 3 8B (torchtitan >= 0.2.0 schema).
# 0.2.0 changes vs 0.1.0: [model] uses hf_assets_path (a dir with a HF tokenizer.json),
# not tokenizer_path (tiktoken .model); `compile` is its own [compile] section (was
# [training].compile); [float8] -> [quantize]; [checkpoint].enable (was enable_checkpoint).
[job]
dump_folder = "trace"
description = "Llama 3 8B training"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1
enable_tensorboard = false

[model]
name = "llama3"
flavor = "8B"
hf_assets_path = "tests/assets/hf_tokenizer"

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 2

[training]
local_batch_size = 2
seq_len = 8192
max_norm = 1.0
steps = 10
dataset = "c4_test"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1
context_parallel_degree = 1

[checkpoint]
enable = false

[activation_checkpoint]
mode = "none"

[compile]
enable = false
