# DeepSeek-V3 671B on TorchTitan (>= 0.2.0): 61 layers, 256 routed experts top-8,
# 1 shared expert, sigmoid routing, MLA attention. This exercises SHARED experts
# (a dense FFN over all tokens, no routing) alongside the routed expert all-to-all.
# A TorchTitan flavor's dims are fixed, so for a quick check on a modest box
# override the flavor: --model.flavor=debugmodel (8 experts top-3, 2 shared). The
# full flavor wants a real multi-GPU cluster (config_gen --ngpu/--vram_mib).
# hf_assets_path points at any HF tokenizer dir (only its vocab size matters for
# embedding dims under Phantora's payload-free sim).
[job]
dump_folder = "trace"
description = "DeepSeek-V3 MoE training"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1
enable_tensorboard = false

[model]
name = "deepseek_v3"
flavor = "671B"
hf_assets_path = "tests/assets/hf_tokenizer"

[optimizer]
name = "AdamW"
lr = 3e-4

[lr_scheduler]
warmup_steps = 2

[training]
local_batch_size = 2
seq_len = 1024
max_norm = 1.0
steps = 3
dataset = "c4_test"

[parallelism]
data_parallel_shard_degree = -1
expert_parallel_degree = 2

[checkpoint]
enable = false

[activation_checkpoint]
mode = "none"

[compile]
enable = false
